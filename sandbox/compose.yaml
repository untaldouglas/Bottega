name: bottega_i3_frappe

services:
  app:
    image: bottega-i3-frappe:16.53.0-bench5.31.1
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      I3_ENVIRONMENT: local-sandbox
      I3_PROVIDER: synthetic-local
      I3_DB_PASSWORD: "${I3_DB_PASSWORD:?I3_DB_PASSWORD must be a synthetic value}"
    ports:
      - "127.0.0.1:${I3_HTTP_PORT:-18753}:8000"
    networks: [i3_internal]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    tmpfs: [/tmp]
    volumes:
      - frappe_sites:/home/frappe/frappe-bench/sites
  db:
    image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    environment:
      MARIADB_ROOT_PASSWORD: "${I3_DB_PASSWORD:?I3_DB_PASSWORD must be a synthetic value}"
      MARIADB_DATABASE: i3_frappe
      MARIADB_USER: i3_frappe
      MARIADB_PASSWORD: "${I3_DB_PASSWORD:?I3_DB_PASSWORD must be a synthetic value}"
    networks: [i3_internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  cache:
    image: redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    networks: [i3_internal]
networks:
  i3_internal:
    internal: true
volumes:
  frappe_sites:
    name: bottega_i3_frappe_sites
